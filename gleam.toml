name = "dream"
version = "3.0.0"
description = "Clean, composable web development for Gleam. No magic."
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream" },
]

[documentation]
# Each guide in docs/guides/ is a page on HexDocs.
pages = [
    { title = "Guides", path = "guides/index.html", source = "./docs/guides/index.md" },
    { title = "Build your first Dream server", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Route requests and add middleware", path = "guides/routing.html", source = "./docs/guides/routing.md" },
    { title = "Read request data safely", path = "guides/request-data.html", source = "./docs/guides/request-data.md" },
    { title = "Send responses, cookies and files", path = "guides/responses.html", source = "./docs/guides/responses.md" },
    { title = "Build a database-backed JSON API", path = "guides/database-api.html", source = "./docs/guides/database-api.md" },
    { title = "Grow a JSON API", path = "guides/api-patterns.html", source = "./docs/guides/api-patterns.md" },
    { title = "Render HTML and other formats", path = "guides/templates.html", source = "./docs/guides/templates.md" },
    { title = "Stream responses and uploads", path = "guides/streaming.html", source = "./docs/guides/streaming.md" },
    { title = "Push live updates with server-sent events", path = "guides/sse.html", source = "./docs/guides/sse.md" },
    { title = "Build a chat with WebSockets", path = "guides/websockets.html", source = "./docs/guides/websockets.md" },
    { title = "Serve HTTPS and HTTP/2", path = "guides/http2.html", source = "./docs/guides/http2.md" },
    { title = "Test your controllers and your app", path = "guides/testing.html", source = "./docs/guides/testing.md" },
    { title = "Deploy with Docker", path = "guides/deployment.html", source = "./docs/guides/deployment.md" },
    { title = "Start, stop and troubleshoot the server", path = "guides/operating.html", source = "./docs/guides/operating.md" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
# dream's HTTP server: a fork of mist 6.0.3 with HTTP/2 fixes, published under
# its own name with mist's module names.
dream_http_server = ">= 2.0.0 and < 3.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"
gleam_json = ">= 2.2.0 and < 4.0.0"
gleam_time = ">= 1.5.0 and < 2.0.0"
marceau = ">= 1.3.0 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"

[dev-dependencies]
squirrel = ">= 4.0.0 and < 5.0.0"
# Pinned to the release commit until 3.0.0 is on Hex.
dream_test = { git = "https://github.com/TrustBound/dream_test.git", ref = "083e64569552e93ac64f0e8f206dad7bf532c505" }
# Pinned to the module's move branch until it is on Hex.
dream_http_client = { git = "https://github.com/TrustBound/dream_http_client.git", ref = "af661517f46417b72b67e84545ba6dcfc04fc59d" }
# Pinned to the module's move branch until it is on Hex.
dream_config = { git = "https://github.com/TrustBound/dream_config.git", ref = "0930ab712e5687f98bdb3d9a297acace3b684bec" }
# Pinned to the module's move branch until it is on Hex.
dream_json = { git = "https://github.com/TrustBound/dream_json.git", ref = "d375862f3107194c6011879fb6492cd2ced8c533" }
# Pinned to the module's move branch until it is on Hex.
dream_opensearch = { git = "https://github.com/TrustBound/dream_opensearch.git", ref = "4af71e43c3d7d04d59c54f2ac6b43af44f3f2799" }
# Pinned to the module's move branch until it is on Hex.
dream_postgres = { git = "https://github.com/TrustBound/dream_postgres.git", ref = "bfdd3435c173947b3aef6c5d5ae280449338ed76" }
# Pinned to the module's move branch until it is on Hex.
dream_snippets = { git = "https://github.com/TrustBound/dream_snippets.git", ref = "6c2bf3e4d19bf023b09822def9cf04c72037b7e4" }
envoy = ">= 1.0.0 and < 2.0.0"
pog = ">= 4.0.0 and < 5.0.0"

[tools.dream_snippets]
# Changelog sections and release notes before this version are history. They are not checked.
checked_from_version = "3.0.0"
badge_guide = "docs/contributing/contributing.md"
# A README guide badge can link to any page under docs/.
guides = ["docs"]
# The files that the tests and CI use. A file, command or output block of the
# docs links one of them.
tested_files = [
  "test",
  ".github",
  "scripts",
  "Makefile",
  "integration",
  "examples/simplest/test",
  "examples/simple/test",
  "examples/custom_context/test",
  "examples/static/test",
  "examples/streaming/test",
  "examples/rate_limiter/test",
  "examples/database/test",
  "examples/database/Makefile",
  "examples/database/docker-compose.yml",
  "examples/database/priv/migrations",
  "examples/database/src/sql",
  "examples/database/gleam.toml",
  "examples/multi_format/test",
  "examples/multi_format/Makefile",
  "examples/streaming_capabilities/test",
  "examples/websocket_chat/test",
  "examples/websocket_chat/Makefile",
  "examples/websocket_chat/assets",
  "examples/sse/test",
  "examples/sse/assets",
  "examples/tasks/test",
  "examples/deployment/test",
  "examples/deployment/Dockerfile",
  "examples/deployment/.dockerignore",
  "examples/deployment/docker-compose.yml",
  "examples/tasks/Makefile",
  "examples/tasks/src/templates",
  "examples/tasks/cypress",
  "examples/tasks/cypress.config.ts",
]
