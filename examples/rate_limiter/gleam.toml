name = "dream_example_rate_limiter"
version = "0.1.0"
description = "Rate limit - a per-client rate limit in a Dream app, counted atomically in an ETS table with dream_ets"
licences = ["MIT"]

[dependencies]
dream = { path = "../.." }
dream_ets = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_time = ">= 1.5.0 and < 2.0.0"

[dev-dependencies]
dream_test = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
