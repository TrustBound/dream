name = "dream_example_outbound_http"
version = "0.1.0"
description = "Outbound HTTP - a Dream app that calls another API from its controllers"
licences = ["MIT"]

[dependencies]
dream = { path = "../.." }
dream_http_client = ">= 6.0.0 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 2.2.0 and < 4.0.0"
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
dream_test = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
