name = "dream_example_background_work"
version = "0.1.0"
description = "Background work - a supervised job worker with a bounded queue, timeouts, a periodic cleanup and a clean stop"
licences = ["MIT"]

[dependencies]
dream = { path = "../.." }
dream_ets = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 2.2.0 and < 4.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
dream_test = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
