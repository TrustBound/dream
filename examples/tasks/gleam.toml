name = "tasks_example"
version = "0.1.0"
description = "Full-featured task app with HTMX, semantic HTML, and matcha templates"
licences = ["MIT"]

[dependencies]
dream = { path = "../.." }
dream_postgres = ">= 2.1.0 and < 3.0.0"
