name: Publish Dream to Hex

on:
  push:
    branches:
      - main
    paths:
      - "gleam.toml"
      - ".github/workflows/publish-modules.yml"
  workflow_dispatch:
    # Allows manual triggering for testing

env:
  OTP_VERSION: "28"
  GLEAM_VERSION: "1.19.2"
  REBAR3_VERSION: "3"

jobs:
  publish-dream:
    name: Publish Core Dream Package
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow creating and pushing git tags
    outputs:
      published: ${{ steps.version_check.outputs.should_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Dream version exists on Hex
        id: version_check
        env:
          FORCE_PUBLISH: ${{ secrets.FORCE_PUBLISH }}
        run: |
          # Check if force publish is enabled
          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "FORCE_PUBLISH is enabled, bypassing version check"
            CURRENT_VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get current version
          CURRENT_VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current Dream version: $CURRENT_VERSION"

          # Check if this version already exists on Hex
          # Use --max-time to prevent hanging, --retry for transient failures
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2 \
            "https://hex.pm/api/packages/dream/releases/$CURRENT_VERSION")
          CURL_EXIT=$?
          
          # Check if curl itself failed (network issues, timeout, etc)
          if [ $CURL_EXIT -ne 0 ]; then
            echo "Error: Failed to check Hex API (curl exit code: $CURL_EXIT)"
            echo "This could be a network issue or Hex API timeout"
            exit 1
          fi
          
          # Handle HTTP status codes
          case "$HTTP_RESPONSE" in
            200)
              echo "✓ Version $CURRENT_VERSION already exists on Hex, skipping publish"
              echo "should_publish=false" >> $GITHUB_OUTPUT
              ;;
            404)
              echo "✓ Version $CURRENT_VERSION not found on Hex, will publish"
              echo "should_publish=true" >> $GITHUB_OUTPUT
              ;;
            429)
              echo "Error: Hex API rate limit exceeded (HTTP 429)"
              echo "Please wait a few minutes and try again"
              exit 1
              ;;
            5*)
              echo "Error: Hex API server error (HTTP $HTTP_RESPONSE)"
              echo "This is likely a temporary Hex issue, please try again later"
              exit 1
              ;;
            *)
              echo "Error: Unexpected HTTP status from Hex API: $HTTP_RESPONSE"
              echo "Cannot determine if version exists, failing safely"
              exit 1
              ;;
          esac

      - name: Install Erlang and Gleam
        if: steps.version_check.outputs.should_publish == 'true'
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Download dependencies
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam deps download

      - name: Build project
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam build

      - name: Run tests
        if: steps.version_check.outputs.should_publish == 'true'
        run: make test-unit

      # A release must not ship a doc code block that does not match its
      # tested snippet. See docs/contributing/contributing.md.
      - name: Check docs code blocks against tested snippets
        if: steps.version_check.outputs.should_publish == 'true'
        run: make check-snippets

      - name: Publish Dream to Hex
        id: publish_hex
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEXPM_API_KEY" ]; then
            echo "Error: HEX_API_KEY secret is not set"
            exit 1
          fi
          gleam publish --yes

      - name: Create and push git tag
        if: steps.version_check.outputs.should_publish == 'true' && steps.publish_hex.outcome == 'success'
        run: |
          # Extract version from gleam.toml
          VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="${VERSION}"

          # Check if tag already exists
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping tag creation"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag
          echo "Creating git tag: ${TAG}"
          git tag -a "${TAG}" -m "Release Dream ${VERSION}"
          git push origin "${TAG}"
          echo "Successfully created and pushed tag: ${TAG}"

      - name: Build documentation
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam docs build

      - name: Publish documentation
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEXPM_API_KEY" ]; then
            echo "Error: HEX_API_KEY secret is not set"
            exit 1
          fi
          echo "Waiting for Hex to process the package..."
          sleep 10
          gleam docs publish
