name: CI

on:
  pull_request:
    branches:
      - main
      - develop

env:
  OTP_VERSION: "28"
  GLEAM_VERSION: "1.17.0"
  REBAR3_VERSION: "3"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keep downloaded packages and path dependency fingerprints between runs,
      # so gleam does not ask the Hex API to resolve versions on every run.
      # The key is unique per run; the save step at the end of the job reuses it.
      - name: Restore Gleam packages
        id: gleam-packages
        uses: actions/cache/restore@v4
        with:
          path: |
            build/packages
            modules/*/build/packages
            examples/*/build/packages
          key: gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-unit-tests-${{ hashFiles('gleam.toml', 'manifest.toml', 'modules/*/gleam.toml', 'modules/*/manifest.toml', 'examples/*/gleam.toml', 'examples/*/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-unit-tests-${{ hashFiles('gleam.toml', 'manifest.toml', 'modules/*/gleam.toml', 'modules/*/manifest.toml', 'examples/*/gleam.toml', 'examples/*/manifest.toml') }}-
            gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-unit-tests-

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Download dependencies
        run: gleam deps download

      - name: Check code format
        run: gleam format --check

      - name: Build project
        run: gleam build

      - name: Patch http_client dependencies
        uses: ./.github/actions/patch-dream-deps
        with:
          module_dir: modules/http_client

      - name: Patch mock_server dependencies
        uses: ./.github/actions/patch-dream-deps
        with:
          module_dir: modules/mock_server

      - name: Run all unit tests
        env:
          CI: "true"
        run: make test-unit

      # Every Gleam code block in the docs must match the tested snippet
      # that its badge links to. See docs/contributing/contributing.md.
      - name: Check docs code blocks against tested snippets
        run: make check-snippets

      - name: Restore http_client dependencies
        if: always()
        uses: ./.github/actions/restore-dream-deps
        with:
          module_dir: modules/http_client

      - name: Restore mock_server dependencies
        if: always()
        uses: ./.github/actions/restore-dream-deps
        with:
          module_dir: modules/mock_server

      # Gleam writes a path dependency fingerprint before it asks Hex to
      # resolve, and build/packages/packages.toml only after all downloads. A
      # fingerprint newer than packages.toml (or with no packages.toml) means
      # that resolution did not finish: drop it, so the next run resolves again.
      - name: Drop fingerprints of unfinished resolutions
        if: always()
        shell: bash
        run: |
          for dir in build/packages modules/*/build/packages examples/*/build/packages; do
            for fp in "$dir"/*.config_fingerprint; do
              [ -f "$fp" ] || continue
              if [ ! -f "$dir/packages.toml" ] || [ "$fp" -nt "$dir/packages.toml" ]; then
                echo "Dropping $fp"
                rm -f "$fp"
              fi
            done
          done

      # Save even when the job fails, so the next run keeps what this run
      # resolved and downloaded.
      - name: Save Gleam packages
        if: always() && steps.gleam-packages.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/packages
            modules/*/build/packages
            examples/*/build/packages
          key: ${{ steps.gleam-packages.outputs.cache-primary-key }}

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dream_example_database_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keep downloaded packages and path dependency fingerprints between runs,
      # so gleam does not ask the Hex API to resolve versions on every run.
      # The key is unique per run; the save step at the end of the job reuses it.
      - name: Restore Gleam packages
        id: gleam-packages
        uses: actions/cache/restore@v4
        with:
          path: |
            build/packages
            modules/*/build/packages
            examples/*/build/packages
          key: gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-integration-tests-${{ hashFiles('gleam.toml', 'manifest.toml', 'modules/*/gleam.toml', 'modules/*/manifest.toml', 'examples/*/gleam.toml', 'examples/*/manifest.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-integration-tests-${{ hashFiles('gleam.toml', 'manifest.toml', 'modules/*/gleam.toml', 'modules/*/manifest.toml', 'examples/*/gleam.toml', 'examples/*/manifest.toml') }}-
            gleam-packages-${{ runner.os }}-gleam${{ env.GLEAM_VERSION }}-otp${{ env.OTP_VERSION }}-integration-tests-

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          elixir-version: "1.18"

      - name: Download dependencies
        run: gleam deps download

      - name: Build project
        run: gleam build

      - name: Setup database examples
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5435/dream_example_database_db
        run: |
          psql -h localhost -p 5435 -U postgres -c "CREATE DATABASE dream_example_multi_format_db;" || true
          cd examples/database
          gleam run -m cigogne all
          cd ../multi_format
          export DATABASE_URL=postgres://postgres:postgres@localhost:5435/dream_example_multi_format_db
          gleam run -m cigogne all

      - name: Run all integration tests
        env:
          CI: "true"
          DATABASE_URL: postgres://postgres:postgres@localhost:5435/dream_example_database_db
          POSTGRES_PORT: "5435"
        run: make test-integration

      # Gleam writes a path dependency fingerprint before it asks Hex to
      # resolve, and build/packages/packages.toml only after all downloads. A
      # fingerprint newer than packages.toml (or with no packages.toml) means
      # that resolution did not finish: drop it, so the next run resolves again.
      - name: Drop fingerprints of unfinished resolutions
        if: always()
        shell: bash
        run: |
          for dir in build/packages modules/*/build/packages examples/*/build/packages; do
            for fp in "$dir"/*.config_fingerprint; do
              [ -f "$fp" ] || continue
              if [ ! -f "$dir/packages.toml" ] || [ "$fp" -nt "$dir/packages.toml" ]; then
                echo "Dropping $fp"
                rm -f "$fp"
              fi
            done
          done

      # Save even when the job fails, so the next run keeps what this run
      # resolved and downloaded.
      - name: Save Gleam packages
        if: always() && steps.gleam-packages.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/packages
            modules/*/build/packages
            examples/*/build/packages
          key: ${{ steps.gleam-packages.outputs.cache-primary-key }}
