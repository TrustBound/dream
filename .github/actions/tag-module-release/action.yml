name: Tag Module Release
description: Create and push the git tag of a module release, <package name>-<version>

# The badges in a module README link at this tag, so a published README
# links to the code that was tested for that release. See "Code Blocks in
# READMEs and Guides" in docs/contributing/contributing.md.
#
# Use it only in a run that published the module, after the publish step,
# so the tag is on the commit that was published. Do not use it for a
# version that was on Hex already: a tag on a newer commit would point at
# code that is not the published code.
#
# The job needs `permissions: contents: write` and a checkout with the tags
# (fetch-depth: 0). When the tag exists, the action does nothing, so a
# second run of the workflow is safe.

inputs:
  package_name:
    description: Name of the package in the module's gleam.toml (e.g., dream_ets)
    required: true
  version:
    description: Version of the module release (e.g., 2.0.0)
    required: true

runs:
  using: composite
  steps:
    - name: Create and push git tag
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$PACKAGE_NAME" ] || [ -z "$VERSION" ]; then
          echo "Error: package_name and version are required"
          exit 1
        fi
        TAG="${PACKAGE_NAME}-${VERSION}"

        # Check if tag already exists
        if git rev-parse "${TAG}" >/dev/null 2>&1; then
          echo "Tag ${TAG} already exists, skipping tag creation"
          exit 0
        fi

        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create and push tag
        echo "Creating git tag: ${TAG}"
        git tag -a "${TAG}" -m "Release ${PACKAGE_NAME} ${VERSION}"
        git push origin "${TAG}"
        echo "Successfully created and pushed tag: ${TAG}"
